[package]
name = "lune-std-process"
version = "0.3.5"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/XopoIII/LuneBlox"
description = "Lune standard library - Process"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
mlua = { version = "0.12.1", features = ["luau"] }
mlua-luau-scheduler = { version = "0.2.4", path = "../mlua-luau-scheduler" }

directories = "6.0"
pin-project = "1.1"

bstr = "1.13"
bytes = "1.12.1"

async-channel = "2.5"
async-lock = "3.4"
async-process = "2.5"
blocking = "1.7"
futures-lite = "2.6"
futures-util = "0.3" # Needed for select! macro...

lune-utils = { version = "0.3.5", path = "../lune-utils" }
