[package]
name = "lune-std-datetime"
version = "0.3.5"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/XopoIII/LuneBlox"
description = "Lune standard library - DateTime"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
mlua = { version = "0.12.1", features = ["luau"] }

thiserror = "2.0"
chrono = "0.4.45"
chrono_lc = "0.1.7"

lune-utils = { version = "0.3.5", path = "../lune-utils" }
