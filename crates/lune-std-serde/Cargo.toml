[package]
name = "lune-std-serde"
version = "0.3.5"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/XopoIII/LuneBlox"
description = "Lune standard library - Serde"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
mlua = { version = "0.12.2", features = ["luau", "serialize", "error-send"] }

async-compression = { version = "0.4", features = [
    "futures-io",
    "brotli",
    "deflate",
    "gzip",
    "zlib",
    "zstd",
] }

blocking = "1.7"
bstr = "1.13"
data-encoding = "2.11"
futures-lite = "2.6"
lz4 = "1.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
saphyr = "0.1"
jsonc-parser = { version = "0.34", features = ["serde"] }
toml = { version = "1.1", features = ["preserve_order"] }

digest = "0.11"
hmac = "0.13"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
# traits-preview implements the digest traits, so blake3 must use the same digest
# major version as the crates above. Check that it does before updating either.
blake3 = { version = "1.8", features = ["traits-preview"] }

lune-utils = { version = "0.3.5", path = "../lune-utils" }
