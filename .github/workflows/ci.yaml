name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # A quiet tree still changes: a new RustSec advisory against a pinned dependency, a
  # runner image that moved, a registry that yanked a crate. Run weekly so it surfaces.
  schedule:
    - cron: "0 6 * * 1"

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    # A gate that hangs is worse than one that fails: cap it so a stall surfaces with its logs
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Tooling
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Check Formatting
        run: ./scripts/format-check.sh

  analyze:
    needs: ["fmt"]
    name: Analyze and lint Luau files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Tooling
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Analyze
        run: ./scripts/analyze.sh

      - name: Lint
        run: selene .lune crates scripts tests

      - name: Type-checking modes
        run: sh scripts/check-strict.sh

      - name: File sizes
        run: sh scripts/check-file-size.sh

      - name: English only
        run: sh scripts/check-english.sh

      - name: Tests registered
        run: sh scripts/check-tests-registered.sh

      - name: Versions
        run: sh scripts/check-versions.sh

  deny:
    name: Check dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Check advisories, licenses and sources
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check

  # The docs site deploys only from main (docs.yml), so building it here puts a broken page or a dead
  # link before review. The link validator fails the build on a dead internal link.
  docs:
    name: Build the docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: ./docs
        run: npm ci

      - name: Build
        working-directory: ./docs
        run: npm run build

  ci:
    needs: ["fmt"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            runner-os: windows-2022
            cargo-target: x86_64-pc-windows-msvc

          - name: Windows aarch64
            runner-os: windows-11-arm
            cargo-target: aarch64-pc-windows-msvc

          - name: Linux x86_64
            runner-os: ubuntu-22.04
            cargo-target: x86_64-unknown-linux-gnu

          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            cargo-target: aarch64-unknown-linux-gnu

          - name: macOS x86_64
            runner-os: macos-15
            cargo-target: x86_64-apple-darwin

          - name: macOS aarch64
            runner-os: macos-15
            cargo-target: aarch64-apple-darwin

    name: CI - ${{ matrix.name }}
    runs-on: ${{ matrix.runner-os }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.cargo-target }}

      # cargo-binstall fell back to building nextest from source on macOS aarch64, which
      # nextest refuses without --locked; install-action always fetches the prebuilt binary
      - name: Install nextest
        uses: taiki-e/install-action@v2.87.27
        with:
          tool: cargo-nextest

      # Luau's C++ and the dependency graph barely move between commits; caching the
      # target directory cuts most of the build time on every run after the first. The
      # key keeps the two macOS targets, which share a runner image, out of each other's
      # cache.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.cargo-target }}

      - name: Build
        run: |
          cargo build --workspace \
          --locked --all-features \
          --target ${{ matrix.cargo-target }}

      - name: Lint
        run: |
          cargo clippy --workspace --all-targets \
          --locked --all-features \
          --target ${{ matrix.cargo-target }} \
          -- -D warnings

      - name: Test
        run: |
          cargo nextest run --no-fail-fast \
          --locked --all-features \
          --target ${{ matrix.cargo-target }}
