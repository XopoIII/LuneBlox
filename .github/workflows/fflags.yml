name: Roblox fast flags

on:
  workflow_dispatch:
  # The live Roblox client moves without a commit here, and with it the fast flags it
  # sets. Regenerate the table weekly and fail when a flag has moved.
  schedule:
    - cron: "0 7 * * 1"

# Nothing is pushed and nothing is opened: the default token of this repository may not
# open pull requests, and issues are turned off. A failed run is the report - it reaches
# the owner as a notification, and its summary carries the diff and what to run.
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TABLE: crates/lune/src/rt/roblox_fflags.rs

jobs:
  drift:
    name: Check for fast flag drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # The generator shells out to `cargo metadata` to find the Luau sources
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # rokit.toml carries the last released LuneBlox, which runs the generator
      - name: Install Tooling
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Regenerate the fast flags
        run: luneblox run scripts/generate_roblox_fflags.luau

      # The header names the client build, which moves every week. Only the rows are
      # flags: compare those, so a new build that sets the same flags stays green.
      - name: Check for drift
        run: |
          rows() {
            grep '^    ("' || true
          }
          committed="$(git show "HEAD:$TABLE" | rows)"
          regenerated="$(rows < "$TABLE")"
          if [ -z "$regenerated" ]; then
            echo "::error::The generator wrote a table with no flags"
            exit 1
          fi
          if [ "$committed" = "$regenerated" ]; then
            echo "The live Roblox client sets the same flags as the committed table." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## The live Roblox client's Luau fast flags have moved"
            echo ""
            echo "Rows of \`$TABLE\`, committed against regenerated:"
            echo ""
            echo '```diff'
            diff -u <(printf '%s\n' "$committed") <(printf '%s\n' "$regenerated") | tail -n +3 || true
            echo '```'
            echo ""
            echo "To take the change, on a branch from \`main\`:"
            echo ""
            echo '```sh'
            echo "rokit install"
            echo "luneblox run scripts/generate_roblox_fflags.luau"
            echo "sh scripts/check-versions.sh"
            echo "cargo nextest run --workspace --all-features"
            echo '```'
            echo ""
            echo "The generator rewrites the table and the lines of the fast flags guide that quote it."
            echo "A flag that fails \`every_roblox_fflag_applies\` is declared in a source the runtime does"
            echo "not link: add that source to \`UNLINKED_SOURCES\` in the generator and regenerate."
            echo "A new flag changes how scripts compile and run, so it goes out in a release with a"
            echo "changelog entry. This run stays red each week until the table matches the client."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::The live Roblox client's fast flags differ from $TABLE; see the run summary"
          exit 1
