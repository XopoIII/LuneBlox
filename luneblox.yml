# Selene standard library for Lune: Luau plus the globals Lune adds.
# Referenced from selene.toml as `std = "luneblox"`.
---
base: luau
name: luneblox
globals:
  # selene's luau base requires assert's message; Luau does not.
  assert:
    args:
      - type: any
      - required: false
        type: string
  # Roblox's Enum. Its enums and their items come from the reflection database at run time, so
  # selene is not given their names and accepts any use of it.
  Enum:
    any: true
  warn:
    args:
      - type: "..."
