[workspace]
resolver = "2"
default-members = ["crates/lune"]
members = [
    "crates/lune",
    "crates/lune-roblox",
    "crates/lune-std",
    "crates/lune-std-datetime",
    "crates/lune-std-fs",
    "crates/lune-std-luau",
    "crates/lune-std-net",
    "crates/lune-std-process",
    "crates/lune-std-regex",
    "crates/lune-std-roblox",
    "crates/lune-std-serde",
    "crates/lune-std-stdio",
    "crates/lune-std-task",
    "crates/lune-utils",
    "crates/mlua-luau-scheduler",
]
# Third-party sources patched in below; not ours to lint or format
exclude = ["vendor"]

# Profile for building the release binary, with the following options set:
#
# 1. Optimize for size
# 2. Automatically strip symbols from the binary
# 3. Enable link-time optimization
#
# Note that we could abort instead of panicking to cut down on size
# even more, but because we use the filesystem & some other APIs we
# need the panic unwinding to properly handle usage of said APIs
#
[profile.release]
opt-level = "z"
strip = true
lto = true

# Luau itself is built for speed, not size
#
# mlua-sys compiles Luau's C++ in its build script, and `cc` takes the optimization
# level from this package's profile, so under the "z" above the whole VM was built
# with -Os. At -O3, measured on an M-series Mac with Luau 0.740 and Roblox's flags:
# pcall 34% faster, a Luau-to-Luau metamethod call 29%, a called closure 24%,
# for 370 KB of binary. The Rust side keeps "z".
[profile.release.package.mlua-sys]
opt-level = 3

# Luau 0.740, the version Roblox runs, ahead of a crates.io release of mlua-sys
#
# mlua 0.12.1 on crates.io pins luau0-src 0.21 (Luau 0.736); mlua's own main moved
# mlua-sys to luau0-src 0.22 (Luau 0.740) at this commit, keeping its version at 0.12.0.
# Only mlua-sys is patched, not mlua: mlua's main also turns fractional-to-integer conversions
# into errors, which Lune's Roblox datatypes rely on. Drop this once mlua-sys ships it.
[patch.crates-io]
mlua-sys = { git = "https://github.com/mlua-rs/mlua", rev = "2cf6c60c65858b9ea95c14cc25dd11da984efad0" }

# Luau's sources as luau0-src 0.22.0+luau740 ships them, with one fix to the ARM64 native code
# generator (search the vendored tree for "LuneBlox:"). Luau 0.740's register allocator can plan
# to reload a spilled value from a constant past K255, which no single ARM64 load reaches: an
# asserting build of Luau (mlua's, so ours) stops the process there, and a release build loads
# the wrong value. Drop this once a Luau release carries a fix.
luau0-src = { path = "vendor/luau0-src" }

# Lints for all crates in the workspace
#
# 1. Error on all lints by default, then make cargo + clippy pedantic lints just warn
# 2. Selectively allow some lints that are _too_ pedantic, such as:
#    - Casts between number types
#    - Module naming conventions
#    - Imports and multiple dependency versions
[workspace.lints.clippy]
all = { level = "deny", priority = -3 }
cargo = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }

cast_lossless = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }

similar_names = { level = "allow", priority = 1 }
unnecessary_wraps = { level = "allow", priority = 1 }
unnested_or_patterns = { level = "allow", priority = 1 }
unreadable_literal = { level = "allow", priority = 1 }

multiple_crate_versions = { level = "allow", priority = 1 }
module_inception = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
needless_pass_by_value = { level = "allow", priority = 1 }
wildcard_imports = { level = "allow", priority = 1 }
